name: JARVIS 2.0 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test Suite
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite (sampled core tests)
        run: |
          python -m pytest TESTS/test_security.py TESTS/test_sandbox_escape.py TESTS/test_os_sandbox.py TESTS/test_layered_security.py TESTS/test_autonomy_guardrails.py -v --tb=short
          python -m pytest TESTS/test_agent_runtime.py TESTS/test_runtime_integration.py -v --tb=short
          python -m pytest TESTS/test_e2e_jarvis.py TESTS/test_cognitive_core_integration.py -v --tb=short
          python -m pytest TESTS/test_neural_core/ -v --tb=short
          python -m pytest TESTS/test_memory_*.py TESTS/test_reasoning*.py TESTS/test_world_model*.py -v --tb=short
          python -m pytest TESTS/test_self_improvement*.py TESTS/test_device_control_disabled.py TESTS/test_discovery*.py TESTS/test_benchmarks.py TESTS/test_reproducibility.py -v --tb=short

      - name: Verify test count
        run: |
          python -m pytest TESTS/ --collect-only -q | tail -1

  lint:
    name: Lint & Static Analysis
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          pip install ruff bandit

      - name: Run Ruff (lint)
        run: |
          ruff check . --output-format=github

      - name: Run Bandit (security)
        run: |
          bandit -r . -f json -o bandit-report.json || true
          bandit -r . -f txt || true

      - name: Check for secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files > .secrets.baseline || true
          cat .secrets.baseline

  build:
    name: Build Verification
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Verify model loads
        run: |
          python -c "
          from neural_core.model_interface import NeuralModelInterface
          interface = NeuralModelInterface()
          status = interface.status()
          print('Model status:', status)
          assert status['model_loaded'] == True
          "

      - name: Verify CLI starts
        run: |
          timeout 5 python jarvis.py <<< 'exit' || true

  docs:
    name: Documentation Check
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify key documents exist
        run: |
          test -f LICENSE
          test -f THIRD_PARTY_NOTICES.md
          test -f requirements.txt
          test -f config.yaml
          test -f DOCUMENTAZIONE/technical-acquisition-package/00_EXECUTIVE_SUMMARY.md
          test -f DOCUMENTAZIONE/technical-acquisition-package/08_DEPENDENCIES_AND_PROVENANCE.md
          test -f DOCUMENTAZIONE/technical-acquisition-package/15_IP_OWNERSHIP_AND_PROVENANCE.md
          test -f DOCUMENTAZIONE/technical-acquisition-package/16_DATASET_CORPUS_PROVENANCE.md
          test -f DOCUMENTAZIONE/technical-acquisition-package/17_MODEL_TRAINING_PROVENANCE.md
          test -f DOCUMENTAZIONE/technical-acquisition-package/ARTIFACT_MANIFEST.json

  artifact-manifest:
    name: Verify Artifact Manifest
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify manifest
        run: |
          python -c "
          import json, hashlib
          with open('DOCUMENTAZIONE/technical-acquisition-package/ARTIFACT_MANIFEST.json') as f:
              m = json.load(f)
          for path, info in m['artifacts'].items():
              import os
              if os.path.exists(path):
                  h = hashlib.sha256()
                  with open(path, 'rb') as f:
                      for chunk in iter(lambda: f.read(65536), b''):
                          h.update(chunk)
                  if h.hexdigest() != info['sha256']:
                      print(f'MISMATCH: {path}')
                      print(f'  Expected: {info[\"sha256\"]}')
                      print(f'  Got:      {h.hexdigest()}')
                      exit(1)
              else:
                  print(f'MISSING: {path}')
                  exit(1)
          print('All artifact hashes verified!')
          "